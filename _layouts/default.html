<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root { --brand-red: #f05868; --ink: #252525; --muted: #656565; --line: #ece8e8; --page-width: 1080px; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: #fff; font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: #315f91; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover, a:focus { color: #1e4168; }
    .site-header { border-bottom: 1px solid var(--line); background: #fff; }
    .header-inner { max-width: var(--page-width); margin: 0 auto; padding: 22px 30px; display: flex; align-items: center; justify-content: space-between; gap: 28px; }
    .brand { display: flex; align-items: center; gap: 14px; color: var(--brand-red); text-decoration: none; min-width: 0; }
    .brand img { width: 62px; height: 62px; object-fit: cover; border-radius: 50%; flex: 0 0 auto; }
    .brand-title { font-size: clamp(1.05rem, 2.1vw, 1.42rem); line-height: 1.18; font-weight: 750; letter-spacing: -.025em; }
    .brand-title span { display: block; }
    .site-nav { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .site-nav a { display: inline-block; padding: 8px 12px; border-radius: 3px; color: var(--ink); text-decoration: none; font-size: .94rem; }
    .site-nav a:hover, .site-nav a:focus { background: #fff0f1; color: #9b3440; }
    .site-nav .instagram-link { color: var(--brand-red); font-weight: 700; }
    .site-nav .instagram-link:hover, .site-nav .instagram-link:focus { color: #9b3440; }
    .page-content { max-width: 820px; margin: 0 auto; padding: 46px 30px 80px; }
    .page-content > h1 { max-width: 760px; color: var(--brand-red); font-size: clamp(2.35rem, 6vw, 3.6rem); line-height: 1.08; letter-spacing: -.045em; margin: 0 0 1rem; }
    .page-content > h1 + p { color: var(--muted); font-size: 1.15rem; max-width: 650px; }
    .page-content h2 { margin-top: 2.3rem; font-size: 1.55rem; line-height: 1.25; }
    .page-content h3 { margin-top: 1.7rem; font-size: 1.15rem; }
    .guide-list { margin: .5rem 0 1.4rem; padding-left: 1.8rem; }
    .guide-list li { padding: .18rem 0; }
    #Standpunkt { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); scroll-margin-top: 1.5rem; }
    #Standpunkt p { padding-bottom: .65rem; border-bottom: 1px solid #f1eeee; }
    .site-footer { max-width: var(--page-width); margin: 0 auto; padding: 18px 30px 32px; border-top: 1px solid var(--line); color: var(--muted); font-size: .86rem; }
    @media (max-width: 720px) {
      .header-inner { align-items: flex-start; flex-direction: column; padding: 18px 20px; gap: 14px; }
      .brand img { width: 54px; height: 54px; }
      .site-nav { justify-content: flex-start; gap: 2px; }
      .site-nav a { padding: 8px 10px; }
      .page-content { padding: 34px 20px 60px; }
      .site-footer { padding-inline: 20px; }
    }
  </style>
</head>
<body>
  <header class="site-header" id="Home">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
        <img src="{{ site.logo | relative_url }}" alt="">
        <span class="brand-title">Studienvertretung<span>VW · SozÖk · SEEP</span></span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#about-the-stv">About</a>
        <a href="#events-and-activities">Events</a>
        <a href="#student-guides">Guides</a>
        <a href="#Standpunkt">Magazin</a>
        <a class="instagram-link" href="https://www.instagram.com/vw.sozoek.seep/" target="_blank" rel="noopener">Instagram ↗</a>
      </nav>
    </div>
  </header>
  <main class="page-content">
    {{ content }}
  </main>
  <footer class="site-footer">Studienvertretung VW · SozÖk · SEEP</footer>
</body>
</html>
